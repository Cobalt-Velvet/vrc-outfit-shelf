services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: seolhui
      POSTGRES_DB: maindb
    ports:
      - "5432:5432"
    volumes:
      - mainvol:/var/lib/postgresql
  testdb:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
      POSTGRES_USER: seolhui
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
volumes: 
  mainvol: