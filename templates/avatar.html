<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRC Outfit Shelf</title>
</head>
<body>
    <header>
        <nav>
            <a href="/avatars">avatars</a>
            <form method="post" action="/signout">
                <input type="submit" value="signout">
            </form>
        </nav>
    </header>

    <main>
        <h1>{{.Avatar.Name}}</h1>

        <p>{{.Avatar.Creator}}</p>
        <p>{{.Avatar.ShopURL}}</p>
        <p>{{.Avatar.Memo}}</p>

        <h2>対応アセット</h2>

        <ul>
            {{range .Assets}}
                <li>{{.Name}}</li>
            {{else}}
                <li>No assets linked yet.</li>
            {{end}}
        </ul>

        <h2>アセットを追加</h2>

        <form method="post" action="/avatars/{{.Avatar.ID}}/assets">
            <select name="asset_id">
                {{range .OwnAssets}}
                <option value="{{.ID}}">{{.Name}}</option>
                {{end}}
            </select>
            <input type="submit" value="LinkMyAssets">
        </form>
    </main>
</body>
</html>
