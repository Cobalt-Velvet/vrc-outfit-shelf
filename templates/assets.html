<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アセット一覧 | VRC Outfit Shelf</title>
</head>
<body>
    <header>
        <nav>
            <a href="/avatars">アバター</a>
            <a href="/assets">アセット</a>
            <form method="post" action="/signout">
                <button type="submit">ログアウト</button>
            </form>
        </nav>
    </header>

    <main>
        <h1>アセット一覧</h1>

        <ul>
            {{range .}}
                <li>
                    {{.Name}}
                    <a href="/assets/{{.ID}}/edit">編集</a>
                    <form method="post" action="/assets/{{.ID}}/delete">
                        <button type="submit">削除</button>
                    </form>
                </li>
            {{else}}
                <li>まだアセットが登録されていません。</li>
            {{end}}
        </ul>

        <h2>アセットを登録</h2>

        <form method="post" action="/assets">
            <label>
                カテゴリ
                <select name="asset_category">
                    <option value="clothing">衣装</option>
                    <option value="hair">髪</option>
                    <option value="accessory">アクセサリー</option>
                    <option value="prop">小物</option>
                    <option value="texture">テクスチャ</option>
                    <option value="tool">ツール</option>
                    <option value="animation">アニメーション</option>
                    <option value="other">その他</option>
                </select>
            </label>
            <label>アセット名 <input name="asset_name" required></label>
            <label>制作者 <input name="creator" required></label>
            <label>ショップURL <input name="shop_url"></label>
            <label>メモ <input name="memo"></label>
            <button type="submit">登録</button>
        </form>
    </main>
</body>
</html>
