<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アバター一覧 | VRC Outfit Shelf</title>
    <link rel="stylesheet" href="/static/water.min.css">
</head>
<body>
    <header>
        <nav>
            <a href="/avatars">アバター</a>
            <a href="/assets">アセット</a>
            <form method="post" action="/signout">
                <button type="submit">ログアウト</button>
            </form>
        </nav>
    </header>

    <main>
        <h1>アバター一覧</h1>

        <ul>
            {{range .}}
                <li>
                    <a href="/avatars/{{.ID}}">{{.Name}}</a>
                </li>
            {{else}}
                <li>まだアバターが登録されていません。</li>
            {{end}}
        </ul>

        <h2>アバターを登録</h2>

        <form method="post" action="/avatars">
            <label>アバター名 <input name="avatar_name" required></label>
            <label>制作者 <input name="creator" required></label>
            <label>ショップURL <input name="shop_url"></label>
            <label>メモ <input name="memo"></label>
            <button type="submit">登録</button>
        </form>
    </main>
</body>
</html>
