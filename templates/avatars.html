<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRC Outfit Shelf</title>
</head>
<body>
    <form method="post" action="/avatars">
        <label>avatar_name: <input name="avatar_name"></label><br>
        <label>creator: <input name="creator"></label><br>
        <label>shop_url: <input name="shop_url"></label><br>
        <label>memo: <input name="memo"></label><br>
        <input type="submit" value="submit"><br>
    </form>

    <div>
        {{range .}}
            <div>{{.Name}}</div>
        {{else}}
            <div>List is empty.</div>
        {{end}}
    </div>
    <div>
        <form method="post" action="/signout">
            <input type="submit" value="signout">
        </form>
    </div>
    <div>
        <a href="/assets">assets</a>
    </div>
</body>
</html>
