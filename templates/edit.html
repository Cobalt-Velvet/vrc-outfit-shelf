<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アセット編集 | VRC Outfit Shelf</title>
</head>
<body>
    <header>
        <nav>
            <a href="/avatars">アバター</a>
            <a href="/assets">アセット</a>
            <form method="post" action="/signout">
                <button type="submit">ログアウト</button>
            </form>
        </nav>
    </header>

    <main>
        <h1>アセット編集</h1>

        <form method="post" action="/assets/{{.ID}}/edit">
            <label>
                カテゴリ
                <select name="asset_category">
                    <option value="clothing" {{if eq .Category "clothing"}}selected{{end}}>衣装</option>
                    <option value="hair" {{if eq .Category "hair"}}selected{{end}}>髪</option>
                    <option value="accessory" {{if eq .Category "accessory"}}selected{{end}}>アクセサリー</option>
                    <option value="prop" {{if eq .Category "prop"}}selected{{end}}>小物</option>
                    <option value="texture" {{if eq .Category "texture"}}selected{{end}}>テクスチャ</option>
                    <option value="tool" {{if eq .Category "tool"}}selected{{end}}>ツール</option>
                    <option value="animation" {{if eq .Category "animation"}}selected{{end}}>アニメーション</option>
                    <option value="other" {{if eq .Category "other"}}selected{{end}}>その他</option>
                </select>
            </label>
            <label>アセット名 <input name="asset_name" value="{{.Name}}" required></label>
            <label>制作者 <input name="creator" value="{{.Creator}}" required></label>
            <label>ショップURL <input name="shop_url" value="{{.ShopURL}}"></label>
            <label>メモ <input name="memo" value="{{.Memo}}"></label>
            <button type="submit">保存</button>
        </form>

        <p><a href="/assets">アセット一覧に戻る</a></p>
    </main>
</body>
</html>
