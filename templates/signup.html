<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員登録 | VRC Outfit Shelf</title>
</head>
<body>
    <header>
        <nav>
            <a href="/">トップ</a>
            <a href="/signin">ログイン</a>
        </nav>
    </header>

    <main>
        <h1>会員登録</h1>

        <form method="post" action="/signup">
            <label>
                VRChat名
                <input name="vrc_name" type="text" autocomplete="username" required>
            </label>
            <label>
                パスワード
                <input name="password" type="password" autocomplete="new-password" required>
            </label>
            <button type="submit">登録</button>
        </form>
    </main>
</body>
</html>
